#
# Keep the vendored LuCI apps in sync with their upstream repositories.
#
# The package sources under the repository root are updated separately by
# "Auto update packages v3", which only bumps versions and hashes. This
# workflow replaces whole directories, so it runs on a schedule and can also
# refresh the package sources on demand.
#
name: "Sync LuCI apps"

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:
    inputs:
      sync_packages:
        description: "also re-sync the package sources from openwrt-passwall-packages"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: sync-luci-apps
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  sync:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync luci-app-passwall
        run: |
          git clone --depth 1 https://github.com/Openwrt-Passwall/openwrt-passwall.git /tmp/passwall
          rsync -a --delete /tmp/passwall/luci-app-passwall/ luci-app-passwall/

      - name: Sync luci-app-passwall2
        run: |
          git clone --depth 1 https://github.com/Openwrt-Passwall/openwrt-passwall2.git /tmp/passwall2
          rsync -a --delete /tmp/passwall2/luci-app-passwall2/ luci-app-passwall2/

      - name: Sync luci-app-openclash
        run: |
          # The OpenClash repository also ships the core binaries, 40+ GB of
          # history. Fetch the LuCI app only, without the blobs of anything else.
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/vernesong/OpenClash.git /tmp/openclash
          cd /tmp/openclash
          git sparse-checkout set luci-app-openclash
          rsync -a --delete /tmp/openclash/luci-app-openclash/ "$GITHUB_WORKSPACE/luci-app-openclash/"

      - name: Sync package sources
        if: ${{ github.event.inputs.sync_packages == 'true' }}
        run: |
          git clone --depth 1 \
            https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git /tmp/packages
          for dir in /tmp/packages/*/; do
            name=$(basename "$dir")
            [ "$name" = ".github" ] && continue
            rsync -a --delete "$dir" "$GITHUB_WORKSPACE/$name/"
          done

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "everything is already up to date"
            exit 0
          fi
          git commit -m "sync: update the vendored LuCI apps from upstream"
          git push
